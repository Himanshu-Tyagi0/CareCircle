name: CareCircle CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_postgres_password
          POSTGRES_DB: carecircle_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint with ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Run unit, integration, accessibility, and PostgreSQL tests with coverage
        env:
          PYTHONPATH: .
          TEST_DATABASE_URL: postgresql://postgres:ci_postgres_password@127.0.0.1:5432/carecircle_test
        run: |
          pytest --cov=core --cov=services --cov-report=term-missing --cov-fail-under=90

      - name: Audit Python dependencies
        run: |
          pip-audit -r requirements.txt -r requirements-dev.txt

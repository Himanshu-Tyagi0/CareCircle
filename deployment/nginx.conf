worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/nginx_client_body;
    proxy_temp_path /tmp/nginx_proxy;
    fastcgi_temp_path /tmp/nginx_fastcgi;
    uwsgi_temp_path /tmp/nginx_uwsgi;
    scgi_temp_path /tmp/nginx_scgi;

    map $request_uri $safe_request_uri {
        ~^(?<path>[^?]+)\?(.*(?:action_token|token|verify|invite)=.*)$ "$path?[REDACTED]";
        default $request_uri;
    }

    log_format carecircle_safe '$remote_addr - [$time_local] "$request_method $safe_request_uri $server_protocol" $status $body_bytes_sent';
    access_log /dev/stdout carecircle_safe;

    sendfile on;
    keepalive_timeout 65;

    server {
        listen 7860;
        server_name _;

        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate, private" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;

        location / {
            proxy_pass http://127.0.0.1:8501;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
        }
    }
}

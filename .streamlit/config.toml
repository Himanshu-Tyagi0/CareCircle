[server]
headless = true
enableXsrfProtection = true
enableCORS = false
maxUploadSize = 11

[browser]
gatherUsageStats = false

[client]
showErrorDetails = false
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#0F5C54"
backgroundColor = "#F8F7F4"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#141A19"
font = "sans serif"
